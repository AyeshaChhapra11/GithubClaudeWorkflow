name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude PR Review
        if: github.event.pull_request.draft == false
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'You are an expert senior software engineer. Perform a detailed pull request review on the code changes. Use the GitHub review tools to post constructive, specific inline comments where issues exist, then submit the review. Be concise and focus only on real problems.'
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github_comment__update_claude_comment"
