name: Claude Code Review

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- FOR PUSHES (COMMITS) ---
      - name: Claude Commit Check
        if: github.event_name == 'push'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: 'Review the changes in this commit push. Briefly summarize any syntax errors, critical bugs, or logic flaws.'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- FOR PULL REQUESTS / MERGES ---
      - name: Claude PR Review
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: anthropics/claude-code-action@v1
        with:
          prompt: 'You are an expert senior software engineer. Perform a detailed pull request review on the code changes. Post constructive, specific feedback as inline comments where issues exist.'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
