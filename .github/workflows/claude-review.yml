name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude PR Review
        if: github.event.pull_request.draft == false
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: 'You are an expert senior software engineer. Perform a detailed pull request review on the code changes. Post constructive, specific feedback as inline comments where issues exist.'
          claude_args: |
            --max-turns 15
