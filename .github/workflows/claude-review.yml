name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Claude PR Review
        if: github.event.pull_request.draft == false
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an expert senior software engineer reviewing a PR diff.

            Rate each potential issue as Critical, Major, or Minor:
            - Critical: bugs, crashes, data loss, security vulnerabilities,
              race conditions, broken logic in the changed code
            - Major: unhandled error paths or missing validation that could
              realistically cause a crash or security issue in production
            - Minor: everything else (style, naming, micro-optimizations)

            Post inline comments ONLY for Critical and Major findings, and
            only when you can name the concrete failure (what input, what
            breaks, what the consequence is). Skip Minor entirely. Do NOT
            comment on a line to confirm it is correct or to suggest
            optional improvements.

            Post at most 8 inline comments. If there are more than 8 real
            issues, comment on the 8 most severe and note the rest in the
            summary.

            Finding nothing significant is a valid and good outcome. If the
            PR has no Critical or Major issues, post a top-level summary that
            says so and stop — do not invent feedback to seem useful.

            End with a one-paragraph top-level summary: overall assessment
            plus a count of issues by severity.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
